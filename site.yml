---
- name: Configuration Nginx on Ubuntu nodes
  hosts: all
  become: true

  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Deploye the home page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: "<h1>Deployed with Ansible on {{ inventory_hostname }}</h1>"
        mode: "0644"


    - name: Start and enable Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
